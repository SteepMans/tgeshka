name: Upstream sync

# Every day: a new release of telegramdesktop/tdesktop is merged into
# main through a pull request. A clean merge with a green build goes to
# main automatically and is released as the next beta (vX.Y.Z-beta),
# clients on the beta channel get it through the auto-update. Stable is
# the "Promote beta" workflow. A conflict is committed with markers into
# a draft pull request and the owner is told in Telegram.
# See docs/updates.md.
#
# Pushes go through the UPSTREAM_SYNC_KEY deploy key: upstream history
# touches .github/workflows, which GITHUB_TOKEN may not push, and a tag
# pushed with GITHUB_TOKEN would not start the release build.

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag (empty for the latest release)
        required: false
        type: string

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    name: Merge upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      branch: ${{ steps.find.outputs.branch }}
      result: ${{ steps.merge.outputs.result }}
      pr: ${{ steps.merge.outputs.pr }}
      sha: ${{ steps.merge.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: https://github.com/telegramdesktop/tdesktop.git
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_KEY }}

      - name: Find upstream release
        id: find
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh api repos/telegramdesktop/tdesktop/releases/latest --jq .tag_name)
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Unexpected upstream tag '$tag'"; exit 1
          fi
          # Upstream tags share the v* namespace with ours: fetched into a
          # private ref and never pushed (a v* tag here is a release).
          git fetch --no-tags "$UPSTREAM" "refs/tags/$tag:refs/upstream/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=upstream/$tag" >> "$GITHUB_OUTPUT"
          echo "Upstream release: $tag"

      - name: Merge into a branch
        id: merge
        env:
          TAG: ${{ steps.find.outputs.tag }}
          BRANCH: ${{ steps.find.outputs.branch }}
        run: |
          if git merge-base --is-ancestor "refs/upstream/$TAG" origin/main; then
            echo "$TAG is already in main."
            echo "result=merged" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "$BRANCH already exists: a previous run waits for the owner."
            echo "result=exists" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH" origin/main
          message="Upstream: Telegram Desktop ${TAG#v}"
          git merge --no-ff --no-commit "refs/upstream/$TAG" || true
          # Known conflicts (README.md "Как обновиться с upstream"):
          # upstream CI files removed here stay removed, README is ours,
          # version files are upstream ones with our brand put back.
          git diff --name-only --diff-filter=U | while read -r path; do
            case "$path" in
              .github/*)
                if ! git cat-file -e "origin/main:$path" 2> /dev/null; then
                  git rm -q --cached -- "$path"; rm -f -- "$path"
                fi ;;
              README.md)
                git checkout -q --ours -- "$path"; git add -- "$path" ;;
              Telegram/SourceFiles/core/version.h|Telegram/Resources/winrc/Telegram.rc)
                # Upstream bumps the version next to our brand lines.
                git checkout -q --theirs -- "$path"
                python3 tools/tgeshka/rebrand_upstream.py "$path" && git add -- "$path" ;;
            esac
          done
          # New upstream workflows would run here: only ours are kept.
          git diff --cached --name-only --diff-filter=A origin/main -- .github | xargs -r git rm -q -f --
          # "What's new" in the app: the next beta tells about the upstream release.
          next=$(sh tools/tgeshka/next_version.sh beta)
          python3 tools/tgeshka/changelog_add.py "$next" "Обновлено до Telegram Desktop ${TAG#v}." \
            && git add CHANGELOG-tgeshka.json
          result=clean
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            result=conflict
            git diff --name-only --diff-filter=U | sed 's/^/conflict: /'
            git add -A
          fi
          git commit -q --no-edit -m "$message"
          git push origin "HEAD:refs/heads/$BRANCH"
          if [ "$result" = clean ]; then
            body="Слияние релиза Telegram Desktop $TAG в main. Если сборка зелёная, ветка вливается автоматически и выходит бета."
            pr=$(gh pr create --base main --head "$BRANCH" --title "$message" --body "$body")
          else
            body="Слияние релиза Telegram Desktop $TAG в main с конфликтами: они закоммичены с маркерами, разрешить в этой ветке. После мержа бету выпускает тег vX.Y.Z-beta."
            pr=$(gh pr create --draft --base main --head "$BRANCH" --title "$message" --body "$body")
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "$result: $pr"

  build:
    name: Build the merge
    needs: merge
    if: needs.merge.outputs.result == 'clean'
    permissions:
      contents: write
      # windows.yml looks up main builds to reuse for release tags.
      actions: read
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ needs.merge.outputs.sha }}
    secrets: inherit

  release:
    name: Merge and release beta
    needs: [merge, build]
    if: needs.merge.outputs.result == 'clean'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.beta.outputs.version }}
    env:
      SHA: ${{ needs.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_KEY }}

      - name: Merge into main
        run: |
          # Fast-forward only: if main moved meanwhile, the PR stays open.
          git fetch origin main
          git merge-base --is-ancestor origin/main "$SHA"
          git push origin "$SHA:refs/heads/main"

      - name: Tag the next beta
        id: beta
        run: |
          next=$(sh tools/tgeshka/next_version.sh beta)
          git tag "v$next" "$SHA"
          # The tag push starts the release build (windows.yml).
          git push origin "v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  notify:
    name: Tell the owner
    needs: [merge, build, release]
    if: always() && (needs.merge.outputs.result == 'clean' || needs.merge.outputs.result == 'conflict' || needs.merge.result == 'failure')
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TG_NOTIFY_TOKEN }}
      CHAT: ${{ secrets.TG_NOTIFY_CHAT }}
      TAG: ${{ needs.merge.outputs.tag }}
      PR: ${{ needs.merge.outputs.pr }}
      MERGE: ${{ needs.merge.outputs.result }}
      BUILD: ${{ needs.build.result }}
      RELEASE: ${{ needs.release.result }}
      VERSION: ${{ needs.release.outputs.version }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Send
        run: |
          [ -n "$TOKEN" ] || { echo 'No TG_NOTIFY_TOKEN'; exit 0; }
          if [ "$MERGE" = conflict ]; then
            text="<b>TGeshka: конфликт с Telegram Desktop $TAG</b>
          Автослияние не прошло, черновой PR с маркерами конфликтов ждёт разрешения: $PR"
          elif [ "$RELEASE" = success ]; then
            text="<b>TGeshka: Telegram Desktop $TAG влит в main</b>
          Бета v$VERSION собирается и придёт клиентам на канале бета. В stable: workflow Promote beta."
          elif [ -z "$MERGE" ]; then
            text="<b>TGeshka: синхронизация с Telegram Desktop упала</b>
          $RUN"
          else
            text="<b>TGeshka: Telegram Desktop $TAG не влит</b>
          Сборка: $BUILD, выпуск: $RELEASE. PR остаётся открытым: $PR
          $RUN"
          fi
          curl -sS -m 20 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${text}" \
            | grep -q '"ok":true'
