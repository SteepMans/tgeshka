name: Windows build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  # Upstream sync (upstream-sync.yml) builds its merge commit with this.
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string

concurrency:
  group: windows-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      # Bump to drop the cached dependencies.
      DEPS_CACHE_VERSION: v1

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Prepare directories
        run: |
          # C: has about 30 GB free, not enough for Qt; D: has about 150 GB. A real directory,
          # not a junction: prepare.py resolves links and keys its stages by the resolved path.
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table Name, @{n='FreeGB';e={[int]($_.Free/1GB)}}
          $tbuild = if (Test-Path 'D:\') { 'D:\TBuild' } else { "$env:USERPROFILE\TBuild" }
          New-Item -ItemType Directory -Force "$tbuild\Libraries", "$tbuild\ThirdParty" | Out-Null
          "TBUILD=$tbuild" >> $env:GITHUB_ENV

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: recursive
          path: src

      - name: Copy sources to build root
        run: |
          robocopy "$env:GITHUB_WORKSPACE\src" "$env:TBUILD\tdesktop" /E /MT:16 /R:1 /W:1 /NFL /NDL /NJH /NP
          if ($LASTEXITCODE -ge 8) { exit 1 }
          exit 0

      - name: Cache key
        run: |
          $hash = (Get-FileHash "$env:TBUILD\tdesktop\Telegram\build\prepare\prepare.py" -Algorithm SHA256).Hash.Substring(0, 16)
          "DEPS_KEY=$env:DEPS_CACHE_VERSION-$hash" >> $env:GITHUB_ENV

      - name: Restore ThirdParty
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win64-third-party-${{ env.DEPS_KEY }}
          restore-keys: win64-third-party-${{ env.DEPS_CACHE_VERSION }}-

      - name: Restore Libraries
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: win64-libs-${{ env.DEPS_KEY }}
          restore-keys: win64-libs-${{ env.DEPS_CACHE_VERSION }}-

      - name: Repair pruned Rust sources
        run: |
          # The prune below used to delete the generated wallet_engine.cpp the application
          # build compiles, while the stage keys stayed valid. Such a cache rebuilds the Rust
          # stages (and the checkouts they compile) instead of failing at configure.
          $libs = "$env:TBUILD\Libraries\win64"
          if ((Test-Path "$libs\cache_keys\tdesktop_rust") -and -not (Test-Path "$libs\tdesktop_rust\out\src\wallet_engine\wallet_engine.cpp")) {
            foreach ($name in 'tlottie', 'wallet-engine', 'tdesktop_rust') {
              Remove-Item -Force -ErrorAction SilentlyContinue "$libs\cache_keys\$name"
            }
            Write-Host 'Pruned Rust stages will be rebuilt'
          }

      - name: Dependencies state before
        run: |
          # prepare.py writes a cache key file per finished stage: the cache is saved again
          # only when a stage was (re)built, a partial run keeps its finished stages.
          $keys = "$env:TBUILD\Libraries\win64\cache_keys"
          $state = if (Test-Path $keys) { (Get-ChildItem $keys -File | Sort-Object Name | ForEach-Object { $_.Name + ':' + (Get-FileHash $_.FullName).Hash }) -join ';' } else { '' }
          "DEPS_BEFORE=$((Get-FileHash -InputStream ([IO.MemoryStream]::new([Text.Encoding]::UTF8.GetBytes($state)))).Hash)" >> $env:GITHUB_ENV
          Write-Host "Finished stages restored: $(if (Test-Path $keys) { (Get-ChildItem $keys -File).Count } else { 0 })"

      - name: Dependencies
        id: deps
        # Leaves time to save the finished stages when the first run cannot finish all of them.
        timeout-minutes: 290
        run: |
          & "$env:TBUILD\tdesktop\build.ps1" -PrepareOnly -Jobs ([Environment]::ProcessorCount)

      - name: Dependencies state after
        id: deps_state
        if: always() && steps.deps.outcome != 'skipped'
        run: |
          $keys = "$env:TBUILD\Libraries\win64\cache_keys"
          $state = if (Test-Path $keys) { (Get-ChildItem $keys -File | Sort-Object Name | ForEach-Object { $_.Name + ':' + (Get-FileHash $_.FullName).Hash }) -join ';' } else { '' }
          $after = (Get-FileHash -InputStream ([IO.MemoryStream]::new([Text.Encoding]::UTF8.GetBytes($state)))).Hash
          "changed=$($after -ne $env:DEPS_BEFORE)" >> $env:GITHUB_OUTPUT
          Write-Host "Finished stages: $(if (Test-Path $keys) { (Get-ChildItem $keys -File).Count } else { 0 }), changed: $($after -ne $env:DEPS_BEFORE)"

      - name: Shrink dependencies
        if: always() && steps.deps_state.outputs.changed == 'True'
        shell: bash
        run: |
          # Upstream win.yml rule plus tdesktop_rust/out: its src holds the generated
          # wallet_engine.cpp the application build compiles.
          LIBS="$(cygpath -u "$TBUILD")/Libraries/win64"
          [ -d "$LIBS" ] || exit 0
          find "$LIBS" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tdesktop_rust/out/*' ')' -type f ')' -o -empty ')' -delete
          du -sh "$LIBS" "$(cygpath -u "$TBUILD")/ThirdParty" || true

      - name: Save ThirdParty
        if: always() && steps.deps_state.outputs.changed == 'True' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win64-third-party-${{ env.DEPS_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Libraries
        if: always() && steps.deps_state.outputs.changed == 'True' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: win64-libs-${{ env.DEPS_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build options
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TGESHKA_GATEWAY_URL: ${{ secrets.TGESHKA_GATEWAY_URL }}
        run: |
          # Secrets are not passed to pull requests from forks: such builds use the upstream
          # test api_id, no default gateway address and are never published.
          $file = Join-Path $env:RUNNER_TEMP 'api.txt'
          if ($env:TG_API_ID -and $env:TG_API_HASH) {
            [IO.File]::WriteAllText($file, "api_id=$env:TG_API_ID`napi_hash=$env:TG_API_HASH`n")
            "API_FILE=$file" >> $env:GITHUB_ENV
            "OFFICIAL=1" >> $env:GITHUB_ENV
            Write-Host 'API credentials: repository secrets'
          } else {
            "OFFICIAL=0" >> $env:GITHUB_ENV
            Write-Host 'API credentials: upstream test values'
          }
          if ($env:TGESHKA_GATEWAY_URL) {
            $gw = Join-Path $env:RUNNER_TEMP 'gateway.txt'
            [IO.File]::WriteAllText($gw, $env:TGESHKA_GATEWAY_URL.Trim())
            "GATEWAY_FILE=$gw" >> $env:GITHUB_ENV
          } else {
            "GATEWAY_FILE=$env:RUNNER_TEMP\no-gateway.txt" >> $env:GITHUB_ENV
          }

      - name: Build
        run: |
          $options = @{ Jobs = [Environment]::ProcessorCount; MinFreeGB = 10; GatewayFile = $env:GATEWAY_FILE }
          if ($env:OFFICIAL -eq '1') { $options.ApiFile = $env:API_FILE } else { $options.TestApi = $true }
          # A release tag v1.2.3 / v1.2.3-beta.1 is the TGeshka version (docs/updates.md).
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and -not '${{ inputs.ref }}') { $options.Version = $env:GITHUB_REF_NAME.Substring(1) }
          & "$env:TBUILD\tdesktop\build.ps1" @options
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zip = Get-ChildItem "$env:TBUILD\tdesktop\out\*.zip" | Select-Object -First 1
          "ZIP=$($zip.FullName)" >> $env:GITHUB_ENV
          "ZIP_NAME=$($zip.BaseName)" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP }}
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && env.OFFICIAL == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TGESHKA_UPDATE_KEY: ${{ secrets.TGESHKA_UPDATE_KEY }}
        run: |
          # The zip is also the update package: update-manifest.json with the Ed25519
          # signature of its sha256 goes next to it (docs/updates.md).
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $minFile = "$env:TBUILD\tdesktop\Telegram\build\tgeshka_min_version"
          $sign = @("$env:TBUILD\tdesktop\tools\tgeshka\sign_update.js", $env:ZIP, $version)
          if (Test-Path $minFile) { $sign += (Get-Content $minFile -TotalCount 1).Trim() }
          node @sign
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $manifest = Join-Path (Split-Path $env:ZIP) 'update-manifest.json'
          $repo = $env:GITHUB_REPOSITORY
          # Beta tags are pre-releases: the gateway gives them to the beta channel only.
          $pre = if ($version.Contains('-')) { @('--prerelease') } else { @() }
          # A release may already exist (created by hand with notes): add the files to it.
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:ZIP $manifest --repo $repo --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if ($pre) { gh release edit $tag --repo $repo --prerelease }
          } else {
            gh release create $tag $env:ZIP $manifest --repo $repo --title $tag --notes "Windows x64 portable build of $env:GITHUB_SHA" @pre
          }
          exit $LASTEXITCODE
